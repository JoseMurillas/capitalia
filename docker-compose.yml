services:
  postgres:
    image: postgres:16-alpine
    container_name: capitalia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: capitalia
      POSTGRES_PASSWORD: capitalia
      POSTGRES_DB: capitalia
    ports:
      - "5433:5432"
    volumes:
      - capitalia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitalia -d capitalia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  capitalia_pgdata:
